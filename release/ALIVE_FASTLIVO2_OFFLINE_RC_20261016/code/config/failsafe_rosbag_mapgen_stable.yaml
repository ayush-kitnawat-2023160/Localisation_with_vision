# Standalone sensor-failsafe FAST-LIVO2 tuning for ALIVE VLP-16 + RealSense.
common:
  lid_topic: /fast_livo2/input/lidar
  imu_topic: /fast_livo2/input/imu
  img_topic: /fast_livo2/input/image
  time_sync_en: false
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

preprocess:
  lidar_type: 2
  scan_line: 16
  point_filter_num: 1
  filter_size_surf: 0.15
  blind: 0.6
  feature_extract_enabled: false

imu:
  imu_en: true
  imu_int_frame: 30
  gravity_est_en: true
  ba_bg_est_en: true
  acc_cov: 0.5
  gyr_cov: 0.01
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001

vio:
  max_iterations: 5
  outlier_threshold: 500
  img_point_cov: 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1
  grid_size: 5
  visual_map_radius: 5.0
  visual_map_prune_every_n: 0

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0001
  voxel_size: 0.4
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]

local_map:
  map_sliding_en: true
  half_map_size: 100
  sliding_thresh: 8

failsafe:
  enable: true
  camera_timeout: 0.5
  lidar_timeout: 0.5
  imu_timeout: 0.2
  camera_recovery_samples: 5
  lidar_recovery_samples: 3
  imu_recovery_samples: 20
  min_lidar_points: 50
  min_visual_constraints: 8
  no_imu_covariance_scale: 5.0
  camera_fail_covariance_scale: 1.05
  lidar_fail_covariance_scale: 1.10
  imu_bridge_covariance_scale: 1.50
  lidar_rejoin_max_translation_jump: 0.8
  lidar_rejoin_max_rotation_deg: 20.0
  imu_rejoin_max_rotation_deg: 4.0
  imu_rejoin_max_tilt_correction_deg: 8.0
  lidar_fail_visual_max_translation_update: 0.35
  lidar_fail_visual_max_rotation_deg: 5.0
  lidar_fail_visual_max_velocity_update: 1.5
  map_correction_enable: true
  map_correction_max_age: 0.6
  map_correction_max_translation_jump: 2.5
  map_correction_max_rotation_deg: 20.0
  map_correction_blend: 1.0
  # Keep absolute-map corrections smooth.  At the cart's normal 10 Hz LiDAR
  # cadence these cap the correction component at roughly 0.13 m / 1.6 deg
  # per estimator cycle, matching the stable standalone tests.
  smooth_map_max_pos_rate: 1.3
  smooth_map_max_rot_rate_deg: 16.0
  smooth_map_max_pos_rate_lidar_fail: 1.3
  smooth_map_max_rot_rate_lidar_fail_deg: 0.0
  smooth_map_max_pos_rate_imu_fail: 2.0
  smooth_map_max_rot_rate_imu_fail_deg: 16.0
  rgbd_displacement_gain: 0.75
  rgbd_displacement_max_step: 0.30
  rgbd_velocity_weight: 0.70
  # Keep exact RGB-D/LiDAR relative SE(3) in the measurement front-end, but do
  # not inject the asynchronous delta as an instantaneous pose correction.
  # v2a showed repeated 0.45 m callback-time corrections and worse LiDAR-loss
  # continuity. Velocity/displacement cues and saved-map absolute corrections
  # still constrain the same persistent ESIKF.
  relative_delta_residual_enable: true
  # Sensor-specific residuals: RGB-D keeps IMU attitude and only nudges
  # translation, while LiDAR supplies full SE(3) support when IMU is absent.
  rgbd_delta_residual_enable: true
  lidar_delta_residual_enable: true
  lidar_delta_direct_state_update: true
  rgbd_delta_direct_position_update: false
  rgbd_delta_position_gain: 1.00
  rgbd_delta_rotation_gain: 0.00
  rgbd_delta_max_position_step: 0.12
  rgbd_delta_max_rotation_step_deg: 0.0
  lidar_delta_position_gain: 0.90
  lidar_delta_rotation_gain: 0.80
  lidar_delta_max_position_step: 0.50
  lidar_delta_max_rotation_step_deg: 4.0
  map_primary_on_imu_failure: true
  map_depth_primary_on_lidar_failure: true
  recovery_lio_warmup_scans: 5

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: failsafe
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  type: 0
  colmap_output_en: false
  filter_size_pcd: 0.15
  interval: -1

image_save:
  img_save_en: false
  interval: 1
