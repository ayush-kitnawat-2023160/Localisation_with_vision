# Legacy calibration record retained for provenance only.
# Runtime launches use config/calibration/recorded_cart_bag.yaml or the locked
# config/calibration/new_cart_measured.yaml profile instead.
#
# FAST-LIVO2 conventions:
#   p_imu = extrinsic_R * p_lidar + extrinsic_T
#   p_camera = Rcl * p_lidar + Pcl
#
# The camera-to-LiDAR transform below is the final Pass 4 calibration supplied
# for the ALIVE golf cart. The bag LiDAR-to-IMU/base_link rotation was recovered
# from recorded TF and verified unchanged across 7,555 source and 17,606
# verification samples.
calibration_status: CAMERA_LIDAR_PASS4_AND_BAG_LIDAR_IMU_VERIFIED
source_camera_lidar: rosbag/tf.yaml
source_lidar_imu: ../lidar_imu_calibration_2026-08-26-15-03-48.yaml

extrin_calib:
  # p_imu(base_link) = R * p_lidar(velodyne) + T.
  # Recorded RPY: [0, +20.0000086 deg, +10.0000043 deg].
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [ 0.925416516, -0.173648251,  0.336824223,
                 0.163175972,  0.984807740,  0.059391224,
                -0.342020284,  0.000000000,  0.939692570]

  # Final Pass 4: p_camera_color_optical = Rcl * p_velodyne + Pcl.
  # RPY [roll, pitch, yaw] = [2.743422, -1.422027, -1.119852].
  Pcl: [-0.136433, -0.216900, -0.117627]
  Rcl: [0.064597105, -0.996741280, 0.048311848,
        -0.133404378, -0.056603857, -0.989443922,
         0.988954239,  0.057470200, -0.136626096]

time_offset:
  imu_time_offset: 0.0
  lidar_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0
