# The Lanelet map is geographic WGS84 data projected by the existing
# lanelet2_interface_ros launch with this exact UTM origin.
lanelet_origin_lat: 28.54875901
lanelet_origin_lon: 77.27399459
utm_zone: 43

# Robust GPS and candidate-selection gates. GPS is only an initial regional
# prior; gps_drift_correction_enabled intentionally defaults to false.
gps_min_samples: 20
gps_outlier_threshold_m: 8.0
gps_max_sigma_m: 15.0
lanelet_search_radius_m: 20.0
minimum_course_displacement_m: 6.0
distance_weight: 1.0
heading_weight: 8.0
route_weight: 3.0
preferred_lanelet_ids: []
initialization_confidence_threshold: 0.55
gps_drift_correction_enabled: false
